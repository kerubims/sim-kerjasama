services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sim-kerjasama-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sim_kerjasama}
      DB_USERNAME: ${DB_USERNAME:-simkerma_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - simkerma-network
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - simkerma-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sim_kerjasama}
      MYSQL_USER: ${DB_USERNAME:-simkerma_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - simkerma-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - simkerma-network

  queue:
    image: sim-kerjasama-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sim_kerjasama}
      DB_USERNAME: ${DB_USERNAME:-simkerma_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - simkerma-network
    depends_on:
      - app
      - db

networks:
  simkerma-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
