<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Administrasi Kerjasama</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- TinyMCE -->
    <script
      src="https://cdn.tiny.cloud/1/bczha7gqbkdyzvkduphnv1hffustqlihvs987ufe1n0whacv/tinymce/6/tinymce.min.js"
      referrerpolicy="origin"
    ></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .tox-promotion {
        display: none !important;
      } /* Hide TinyMCE promotion */

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex flex-col"
  >
    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col h-full relative">
      <!-- Content injected by JS -->
    </div>

    <!-- Modals Container -->
    <div
      id="modal-container"
      class="relative z-50 hidden"
      aria-labelledby="modal-title"
      role="dialog"
      aria-modal="true"
    >
      <div
        class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"
      ></div>
      <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div
          class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0"
        >
          <div
            id="modal-content"
            class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg"
          >
            <!-- Modal Content Injected Here -->
          </div>
        </div>
      </div>
    </div>

    <script>
      /**
       * ==========================================
       * DATA LAYER & MOCK DATABASE
       * ==========================================
       */

      const MOCK_USERS = [
        {
          id: "u1",
          username: "admin",
          name: "Super Admin",
          role: "super_admin",
          avatar:
            "https://ui-avatars.com/api/?name=Super+Admin&background=0D8ABC&color=fff",
        },
        {
          id: "u2",
          username: "unit_ti",
          name: "Unit TI",
          role: "unit_pengusul",
          avatar:
            "https://ui-avatars.com/api/?name=Unit+TI&background=27AE60&color=fff",
        },
        {
          id: "u3",
          username: "pt_tech",
          name: "PT Teknologi Maju",
          role: "client",
          avatar:
            "https://ui-avatars.com/api/?name=PT+Tech&background=E67E22&color=fff",
        },
        {
          id: "u4",
          username: "pt_rsj",
          name: "PT RSJ Kota Malang",
          role: "client",
          avatar:
            "https://ui-avatars.com/api/?name=PT+RSJ&background=9B59B6&color=fff",
        },
      ];

      const INITIAL_DOCS = [];

      class StorageManager {
        static get(key, defaultVal) {
          const val = localStorage.getItem(key);
          return val ? JSON.parse(val) : defaultVal;
        }
        static set(key, val) {
          localStorage.setItem(key, JSON.stringify(val));
        }
        static clear() {
          localStorage.clear();
          window.location.reload();
        }
      }

      class DB {
        constructor() {
          this.users = MOCK_USERS;
          this.documents = StorageManager.get("documents", INITIAL_DOCS);
        }

        saveDocs() {
          StorageManager.set("documents", this.documents);
        }

        getDocs() {
          return this.documents;
        }

        getDocById(id) {
          return this.documents.find((d) => d.id === id);
        }

        addDoc(doc) {
          this.documents.push(doc);
          this.saveDocs();
        }

        updateDoc(id, updates) {
          const idx = this.documents.findIndex((d) => d.id === id);
          if (idx !== -1) {
            this.documents[idx] = { ...this.documents[idx], ...updates };
            this.saveDocs();
            return this.documents[idx];
          }
          return null;
        }

        getUser(username) {
          return this.users.find((u) => u.username === username);
        }

        getUsersByRole(role) {
          return this.users.filter((u) => u.role === role);
        }
        
        getUserById(id) {
          return this.users.find((u) => u.id === id);
        }
      }

      const db = new DB();

      /**
       * ==========================================
       * CORE LOGIC: AUTH & ROUTER
       * ==========================================
       */

      const Auth = {
        user: null,
        login(username) {
          const user = db.getUser(username);
          if (user) {
            this.user = user;
            StorageManager.set("currentUser", user);
            App.navigate("dashboard");
          } else {
            alert("User tidak ditemukan!");
          }
        },
        logout() {
          this.user = null;
          StorageManager.set("currentUser", null);
          App.navigate("login");
        },
        init() {
          const saved = StorageManager.get("currentUser", null);
          if (saved) this.user = saved;
        },
        check() {
          return !!this.user;
        },
      };

      const Router = {
        currentRoute: "login",
        routes: {
          login: () => Views.Login(),
          dashboard: () => Views.Dashboard(),
          documents: () => Views.DocumentList(),
          users: () => Views.UserList(),
          reports: () => Views.Reports(),
          tracking: () => Views.Tracking(),
          editor: (params) => Views.Editor(params),
        },
        navigate(route, params = {}) {
          this.currentRoute = route;
          const viewFn = this.routes[route];
          if (viewFn) {
            const html = viewFn(params);
            document.getElementById("app").innerHTML = html;
            this.afterRender(route, params);
          }
        },
        afterRender(route, params) {
          // Attach event listeners based on route
          if (route === "login") Handlers.attachLogin();
          if (route === "dashboard") Handlers.attachDashboard();
          if (route === "reports") Handlers.generateReport();
          if (route === "tracking") Handlers.attachTracking();
          if (route === "editor") Handlers.attachEditor(params);
        },
      };

      /**
       * ==========================================
       * VIEWS (HTML TEMPLATES)
       * ==========================================
       */

      const Views = {
        Login: () => `
                <div class="flex min-h-screen flex-col justify-center px-6 py-12 lg:px-8 bg-slate-100">
                    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
                        <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight text-slate-900">
                            Sistem Administrasi Kerjasama
                        </h2>
                        <p class="mt-2 text-center text-sm text-slate-500">Silakan pilih role untuk simulasi login</p>
                    </div>

                    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
                        <div class="space-y-4">
                            ${MOCK_USERS.map(
                              (u) => `
                                <button onclick="Auth.login('${u.username}')" 
                                    class="flex w-full items-center justify-between rounded-md bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50">
                                    <div class="flex items-center gap-3">
                                        <img src="${u.avatar}" class="h-8 w-8 rounded-full">
                                        <div class="text-left">
                                            <div class="font-bold">${u.name}</div>
                                            <div class="text-xs text-slate-500 capitalize">${u.role.replace("_", " ")}</div>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-arrow-right text-slate-400"></i>
                                </button>
                            `,
                            ).join("")}
                        </div>
                        
                        <div class="mt-8 text-center">
                            <button onclick="StorageManager.clear()" class="text-xs text-red-500 hover:underline">
                                Reset Semua Data (Clear Storage)
                            </button>
                        </div>
                    </div>
                </div>
            `,

        Dashboard: () => {
          const user = Auth.user;
          // Filter docs: Admin sees all, others see only assigned
          let docs = db.getDocs();
          if (user.role !== 'super_admin') {
              docs = docs.filter(d => 
                (d.assignedToClient === user.id || d.assignedToUnit === user.id) && 
                d.status !== 'draft' // Hide draft documents from non-admin
              );
          }
          const isSuperAdmin = user.role === 'super_admin';
          
          // Mock Stats Data (Visual only for prototype)
          const stats = {
              total: 1248,
              active: 856,
              expiring: 24,
              expired: 12
          };

          return `
            <div class="flex h-screen overflow-hidden bg-slate-50 font-inter">
                <!-- Sidebar -->
                <div class="w-64 bg-white border-r border-slate-200 flex flex-col">
                    <div class="p-6 flex items-center gap-3">
                        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white">
                            <i class="fa-solid fa-graduation-cap"></i>
                        </div>
                        <span class="font-bold text-lg text-slate-800 tracking-tight">SIM-KERMA</span>
                    </div>
                    
                    <div class="px-4 py-2">
                        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">System</div>
                        <nav class="space-y-1">
                            <a href="#" onclick="App.navigate('dashboard')" class="flex items-center gap-3 px-4 py-2.5 bg-blue-50 text-blue-700 rounded-lg text-sm font-medium">
                                <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                            </a>
                            ${isSuperAdmin ? `
                            <a href="#" onclick="App.navigate('documents')" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-medium transition">
                                <i class="fa-solid fa-file-lines w-5"></i> Dokumen Kerjasama
                            </a>
                            <a href="#" onclick="App.navigate('tracking')" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-medium transition">
                                <i class="fa-solid fa-diagram-project w-5"></i> Tracking Dokumen
                            </a>
                            <a href="#" onclick="App.navigate('reports')" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-medium transition">
                                <i class="fa-solid fa-file-export w-5"></i> Export Laporan
                            </a>
                            <a href="#" onclick="App.navigate('users')" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-medium transition">
                                <i class="fa-solid fa-users w-5"></i> Users
                            </a>
                            ` : ''}
                        </nav>
                    </div>

                    <div class="mt-auto p-4 border-t border-slate-200">
                        <div class="flex items-center gap-3">
                            <img src="${user.avatar}" class="h-10 w-10 rounded-full border border-slate-200">
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-bold text-slate-900 truncate">${user.name}</div>
                                <div class="text-xs text-slate-500 truncate">${user.username}@univ.ac.id</div>
                            </div>
                            <button onclick="Auth.logout()" class="text-slate-400 hover:text-red-500 transition">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="flex-1 flex flex-col overflow-hidden">
                    <!-- Header -->
                    <header class="bg-white h-16 border-b border-slate-200 flex items-center justify-between px-8">
                        <h2 class="text-xl font-bold text-slate-800">Dashboard Overview</h2>
                        <div class="flex items-center gap-6">
                            <div class="relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="text" placeholder="Cari dokumen..." class="pl-10 pr-4 py-2 bg-slate-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 w-64 transition">
                            </div>
                            <button class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-moon"></i></button>
                            <button onclick="Handlers.toggleNotifications()" class="text-slate-400 hover:text-slate-600 relative">
                                <i class="fa-regular fa-bell"></i>
                                <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                            </button>
                        </div>
                    </header>

                    <main class="flex-1 overflow-y-auto p-8">
                        <!-- Welcome Section -->
                        <div class="mb-8">
                            <h1 class="text-2xl font-bold text-slate-900">Selamat Datang, ${user.name}</h1>
                            <p class="text-slate-500 mt-1">
                                ${isSuperAdmin ? 'Berikut adalah ringkasan data kerjasama universitas per hari ini.' : 'Berikut adalah daftar dokumen kerjasama yang perlu Anda tinjau.'}
                            </p>
                        </div>

                        ${isSuperAdmin ? `
                        <!-- Stats Cards (Admin Only) -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                            <!-- Total Mitra -->
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <div class="text-sm text-slate-500 font-medium">Total Mitra</div>
                                        <div class="text-3xl font-bold text-slate-900 mt-1">${stats.total.toLocaleString()}</div>
                                    </div>
                                    <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600">
                                        <i class="fa-solid fa-building-columns"></i>
                                    </div>
                                </div>
                                <div class="flex items-center text-xs font-medium text-green-600">
                                    <i class="fa-solid fa-arrow-up mr-1"></i> 12% <span class="text-slate-400 ml-1 font-normal">vs bulan lalu</span>
                                </div>
                            </div>

                            <!-- Dokumen Aktif -->
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <div class="text-sm text-slate-500 font-medium">Dokumen Aktif</div>
                                        <div class="text-3xl font-bold text-slate-900 mt-1">${stats.active}</div>
                                    </div>
                                    <div class="w-10 h-10 bg-green-50 rounded-lg flex items-center justify-center text-green-600">
                                        <i class="fa-solid fa-file-circle-check"></i>
                                    </div>
                                </div>
                                <div class="flex items-center text-xs font-medium text-green-600">
                                    <i class="fa-solid fa-arrow-up mr-1"></i> 5% <span class="text-slate-400 ml-1 font-normal">MoU & MoA</span>
                                </div>
                            </div>

                            <!-- Masa Tenggang -->
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <div class="text-sm text-slate-500 font-medium">Masa Tenggang</div>
                                        <div class="text-3xl font-bold text-slate-900 mt-1">${stats.expiring}</div>
                                    </div>
                                    <div class="w-10 h-10 bg-yellow-50 rounded-lg flex items-center justify-center text-yellow-600">
                                        <i class="fa-solid fa-triangle-exclamation"></i>
                                    </div>
                                </div>
                                <div class="text-xs font-medium text-yellow-600">
                                    Expiring < 30 days
                                </div>
                            </div>

                            <!-- Kedaluwarsa -->
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <div class="text-sm text-slate-500 font-medium">Kedaluwarsa</div>
                                        <div class="text-3xl font-bold text-slate-900 mt-1">${stats.expired}</div>
                                    </div>
                                    <div class="w-10 h-10 bg-red-50 rounded-lg flex items-center justify-center text-red-600">
                                        <i class="fa-solid fa-file-circle-xmark"></i>
                                    </div>
                                </div>
                                <div class="text-xs font-medium text-red-600">
                                    Perlu tindak lanjut
                                </div>
                            </div>
                        </div>

                        <!-- Charts Section (Admin Only) -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                            <!-- Bar Chart -->
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 lg:col-span-2">
                                <div class="flex justify-between items-center mb-6">
                                    <h3 class="font-bold text-slate-800">Tren Kerjasama (MoU & MoA)</h3>
                                    <select class="text-xs border-none bg-slate-50 rounded px-2 py-1 text-slate-600 focus:ring-0 cursor-pointer">
                                        <option>Tahun Ini</option>
                                    </select>
                                </div>
                                <div class="h-64">
                                    <canvas id="barChart"></canvas>
                                </div>
                            </div>

                            <!-- Donut Chart -->
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                <h3 class="font-bold text-slate-800 mb-6">Kategori Mitra</h3>
                                <div class="h-48 relative flex justify-center">
                                    <canvas id="donutChart"></canvas>
                                </div>
                                <div class="mt-6 grid grid-cols-2 gap-4 text-xs">
                                    <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-800"></span> Industri</div>
                                    <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-400"></span> Pemerintah</div>
                                    <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-teal-400"></span> NGO</div>
                                    <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-slate-300"></span> Lainnya</div>
                                </div>
                            </div>
                        </div>
                        ` : ''}

                        <!-- Recent Documents Table -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                                <h3 class="font-bold text-slate-800">
                                    ${isSuperAdmin ? 'Dokumen Kerjasama Terbaru' : 'Daftar Dokumen Anda'}
                                </h3>
                                ${user.role === 'super_admin' ? `
                                    <button onclick="Handlers.createNewDoc()" class="text-sm text-blue-600 font-medium hover:underline">
                                        + Buat Baru
                                    </button>
                                ` : ''}
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-slate-600">
                                    <thead class="bg-slate-50 text-xs uppercase font-semibold text-slate-500">
                                        <tr>
                                            <th class="px-6 py-4">Nama Mitra</th>
                                            <th class="px-6 py-4">Jenis</th>
                                            <th class="px-6 py-4">Nomor Dokumen</th>
                                            <th class="px-6 py-4">Tanggal Mulai</th>
                                            <th class="px-6 py-4">Status</th>
                                            <th class="px-6 py-4 text-right">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${docs.length === 0 ? `
                                            <tr><td colspan="6" class="px-6 py-8 text-center text-slate-400">Belum ada dokumen</td></tr>
                                        ` : docs.map(doc => `
                                            <tr class="hover:bg-slate-50 transition">
                                                <td class="px-6 py-4 font-medium text-slate-900">
                                                    ${db.getUserById(doc.assignedToClient)?.name || 'Mitra Umum'}
                                                </td>
                                                <td class="px-6 py-4">${doc.type || 'MoU'}</td>
                                                <td class="px-6 py-4 font-mono text-xs text-slate-500">023/MOU/TI/2023</td>
                                                <td class="px-6 py-4">${new Date(doc.createdAt).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'})}</td>
                                                <td class="px-6 py-4">
                                                    <span class="px-2.5 py-1 rounded-full text-xs font-medium 
                                                        ${doc.status === 'signed' ? 'bg-green-100 text-green-700' : 
                                                          doc.status === 'draft' ? 'bg-slate-100 text-slate-600' : 
                                                          'bg-yellow-100 text-yellow-700'}">
                                                        ${doc.status === 'signed' ? 'Aktif' : doc.status.replace('_', ' ').toUpperCase()}
                                                    </span>
                                                </td>
                                                <td class="px-6 py-4 text-right">
                                                    <button onclick="App.navigate('editor', {id: '${doc.id}'})" class="text-slate-400 hover:text-blue-600">
                                                        <i class="fa-solid fa-eye"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
            `;
        },

        Editor: (params) => {
          const doc = db.getDocById(params.id);
          if (!doc) return '<div class="p-10 text-center text-red-500">Dokumen tidak ditemukan</div>';

          const user = Auth.user;
          const isEditable = (
            (user.role === 'super_admin' && doc.status === 'draft') ||
            (user.role === 'client' && doc.status === 'review_client') ||
            (user.role === 'unit_pengusul' && doc.status === 'review_unit')
          );
          
          // Admin Super Edit capability
          const canEditContent = isEditable || (user.role === 'super_admin' && doc.status !== 'signed');

          return `
            <div class="flex h-screen flex-col bg-white">
                <!-- Editor Header -->
                <header class="border-b border-slate-200 px-6 py-3 flex justify-between items-center bg-white z-10">
                    <div class="flex items-center gap-4">
                        <button onclick="App.navigate('dashboard')" class="text-slate-500 hover:text-slate-800">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <div>
                            <h1 class="text-lg font-bold text-slate-900">${doc.title}</h1>
                            <div class="flex items-center gap-2 text-xs text-slate-500">
                                <span class="px-2 py-0.5 rounded-full bg-slate-100 border border-slate-200">
                                    ${doc.status.toUpperCase()}
                                </span>
                                <span>Last saved: ${new Date(doc.updatedAt).toLocaleTimeString()}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        ${Components.ActionButtons(doc, user)}
                    </div>
                </header>

                <!-- Main Editor Area -->
                <div class="flex-1 flex overflow-hidden">
                    <!-- WYSIWYG Container -->
                    <div class="flex-1 bg-slate-100 overflow-y-auto p-8 flex justify-center">
                        <div class="w-full max-w-[816px] bg-white shadow-sm min-h-[1056px] p-0">
                            <textarea id="editor-area" class="w-full h-full opacity-0">${doc.content}</textarea>
                        </div>
                    </div>

            review_client: "bg-yellow-100 text-yellow-800",
            review_unit: "bg-blue-100 text-blue-800",
            signed: "bg-green-100 text-green-800",
          };

          // Expiry Logic
          let expiryBadge = '';
          if (doc.status === 'signed') {
              // Mocking a validUntil date for prototype if not present (e.g. 1 year from creation)
              const validUntil = doc.validUntil ? new Date(doc.validUntil) : new Date(new Date(doc.createdAt).setFullYear(new Date(doc.createdAt).getFullYear() + 1));
              const now = new Date();
              const diffMonths = (validUntil.getFullYear() - now.getFullYear()) * 12 + (validUntil.getMonth() - now.getMonth());
              
              if (diffMonths <= 1) {
                  expiryBadge = '<span class="ml-2 px-2 py-1 rounded-full text-xs font-bold bg-red-100 text-red-600 border border-red-200"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Expiring Soon</span>';
              } else if (diffMonths <= 3) {
                  expiryBadge = '<span class="ml-2 px-2 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-600 border border-orange-200">Expiring < 3 Mo</span>';
              } else if (diffMonths <= 6) {
                  expiryBadge = '<span class="ml-2 px-2 py-1 rounded-full text-xs font-bold bg-yellow-100 text-yellow-600 border border-yellow-200">Expiring < 6 Mo</span>';
              }
          }

          return `

            (user.role === 'client' && doc.clientSignature) ||
            (user.role === 'unit_pengusul' && doc.unitSignature)
          );
          
          // Save Button (only if user hasn't signed and can edit)
          if (!userHasSigned && (
            (user.role === 'super_admin' && doc.status !== 'signed') ||
            (user.role === 'client' && doc.status === 'review_client') ||
            (user.role === 'unit_pengusul' && doc.status === 'review_unit')

            buttons += `
              <button id="btn-save" class="text-slate-600 hover:text-slate-900 px-3 py-2 text-sm font-medium">

            buttons += `

          }
          
          if (user.role === 'client' && doc.status === 'review_client' && !doc.clientSignature) {
             buttons += `

              buttons += `

              if (type === 'MoA') {

            const endDate = document.getElementById('input-end-date').value;
            const parentDocId = document.getElementById('input-parent').value;
            
            // Get parties data
            const validParties = parties.filter(p => p.userId);
            
            if (!title || !startDate || !endDate) {
              alert('Mohon lengkapi semua field!');
              return;
            }
            
            // Validate at least 2 parties
            if (validParties.length < 2) {
              alert('Minimal harus ada 2 pihak yang dipilih dalam kerjasama!');
              return;
            }
            
            // Validate dates
            if (new Date(endDate) <= new Date(startDate)) {
              alert('Tanggal selesai harus lebih besar dari tanggal mulai!');
              return;
            }
            
            // Get first external party as client (for backward compatibility)
            const externalParty = validParties.find(p => p.type === 'external');
            const internalParty = validParties.find(p => p.type === 'internal');
            
            const newDoc = {
              id: 'doc_' + Date.now(),
              title: title,
              type: type,
              content: '<h1>Perjanjian Kerjasama</h1><p>Silakan edit isi perjanjian ini...</p>',
              status: 'draft',
              createdBy: Auth.user.id,
              // Store all parties
              parties: validParties.map(p => ({
                type: p.type,
                userId: p.userId,
                name: db.getUserById(p.userId)?.name || 'Unknown'
              })),
              // Keep backward compatibility
              assignedToClient: externalParty?.userId || validParties[0]?.userId || null,
              assignedToUnit: internalParty?.userId || validParties[1]?.userId || null,
              parentDocId: parentDocId || null,
              startDate: startDate,
              endDate: endDate,
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
              history: [
                {
                  timestamp: new Date().toISOString(),
                  actor: Auth.user.name,
                  action: 'Created',
                  message: `Dokumen ${type} dibuat dengan ${validParties.length} pihak${parentDocId ? ' dan rujukan' : ''}`
                }
              ]
            };
            
            db.addDoc(newDoc);
            modal.classList.add('hidden');
            App.navigate('editor', { id: newDoc.id });
          };
        },

        generateReport: () => {
          const dateFrom = document.getElementById('report-date-from')?.value;
          const dateTo = document.getElementById('report-date-to')?.value;
          const docType = document.getElementById('report-doc-type')?.value || 'all';
          const status = document.getElementById('report-status')?.value || 'all';
          const unitFilter = document.getElementById('report-unit')?.value || 'all';
          const clientFilter = document.getElementById('report-client')?.value || 'all';
          
          let docs = db.getDocs();
          
          // Apply filters
          if (dateFrom) docs = docs.filter(d => new Date(d.createdAt) >= new Date(dateFrom));
          if (dateTo) docs = docs.filter(d => new Date(d.createdAt) <= new Date(dateTo + 'T23:59:59'));
          if (docType !== 'all') docs = docs.filter(d => d.type === docType);
          if (status !== 'all') docs = docs.filter(d => d.status === status);
          if (unitFilter !== 'all') docs = docs.filter(d => d.assignedToUnit === unitFilter);
          if (clientFilter !== 'all') docs = docs.filter(d => d.assignedToClient === clientFilter);
          
          // Sort by creation date
          docs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          
          // Calculate stats
          const mouCount = docs.filter(d => d.type === 'MoU').length;
          const moaCount = docs.filter(d => d.type === 'MoA').length;
          const iaCount = docs.filter(d => d.type === 'IA').length;
          const signedCount = docs.filter(d => d.status === 'signed').length;
          const draftCount = docs.filter(d => d.status === 'draft').length;
          const reviewCount = docs.filter(d => d.status.includes('review')).length;
          
          // Update Stats
          const statTotal = document.getElementById('stat-total');
          const statMou = document.getElementById('stat-mou');
          const statMoa = document.getElementById('stat-moa');
          const statIa = document.getElementById('stat-ia');
          const statSigned = document.getElementById('stat-signed');
          
          if (statTotal) statTotal.textContent = docs.length;
          if (statMou) statMou.textContent = mouCount;
          if (statMoa) statMoa.textContent = moaCount;
          if (statIa) statIa.textContent = iaCount;
          if (statSigned) statSigned.textContent = signedCount;
          
          // Update period badge
          const periodBadge = document.getElementById('report-period-badge');
          const periodText = document.getElementById('period-text');
          if (periodBadge && periodText) {
            if (dateFrom || dateTo) {
              periodBadge.classList.remove('hidden');
              const fromStr = dateFrom ? new Date(dateFrom).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'}) : 'Awal';
              const toStr = dateTo ? new Date(dateTo).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'}) : 'Sekarang';
              periodText.textContent = `${fromStr} - ${toStr}`;
            } else {
              periodBadge.classList.add('hidden');
            }
          }
          
          // Update Table
          const tableContainer = document.getElementById('report-table-container');
          if (!tableContainer) return;
          
          const btnPdf = document.getElementById('btn-export-report-pdf');
          const btnExcel = document.getElementById('btn-export-report-excel');
          const btnPrint = document.getElementById('btn-print-report');
          const summary = document.getElementById('report-summary');
          const chartSection = document.getElementById('report-chart-section');
          
          if (docs.length === 0) {
              tableContainer.innerHTML = `
                <div class="p-12 text-center text-slate-400">
                    <i class="fa-solid fa-folder-open text-5xl mb-4 opacity-50"></i>
                    <p class="text-lg">Tidak ada data ditemukan</p>
                    <p class="text-sm mt-1">Coba ubah kriteria filter Anda.</p>
                </div>`;
              if (btnPdf) btnPdf.classList.add('hidden');
              if (btnExcel) btnExcel.classList.add('hidden');
              if (btnPrint) btnPrint.classList.add('hidden');
              if (summary) summary.textContent = 'Tidak ada data ditemukan untuk kriteria filter ini';
              if (chartSection) chartSection.classList.add('hidden');
          } else {
              if (btnPdf) btnPdf.classList.remove('hidden');
              if (btnExcel) btnExcel.classList.remove('hidden');
              if (btnPrint) btnPrint.classList.remove('hidden');
              if (summary) summary.textContent = `Menampilkan ${docs.length} dokumen kerjasama (${mouCount} MoU, ${moaCount} MoA, ${iaCount} IA)`;
              if (chartSection) chartSection.classList.remove('hidden');
              
              tableContainer.innerHTML = `
                <table id="report-table" class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-xs uppercase font-semibold text-slate-500">
                        <tr>
                            <th class="px-4 py-3 w-12">No</th>
                            <th class="px-4 py-3">Judul Dokumen</th>
                            <th class="px-4 py-3 w-20">Jenis</th>
                            <th class="px-4 py-3">Pihak/Mitra</th>
                            <th class="px-4 py-3">Unit Pengusul</th>
                            <th class="px-4 py-3 w-28">Tanggal Dibuat</th>
                            <th class="px-4 py-3 w-28">Masa Berlaku</th>
                            <th class="px-4 py-3 w-28">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${docs.map((d, i) => `
                            <tr class="hover:bg-slate-50 transition">
                                <td class="px-4 py-3 text-slate-400 font-mono text-center">${i + 1}</td>
                                <td class="px-4 py-3 font-medium text-slate-900">
                                    <div class="max-w-xs truncate" title="${d.title}">${d.title}</div>
                                </td>
                                <td class="px-4 py-3">
                                    <span class="px-2 py-0.5 rounded text-xs font-bold ${
                                        d.type === 'MoU' ? 'bg-blue-100 text-blue-700' :
                                        d.type === 'MoA' ? 'bg-purple-100 text-purple-700' :
                                        'bg-teal-100 text-teal-700'
                                    }">${d.type}</span>
                                </td>
                                <td class="px-4 py-3 text-sm">
                                    ${(d.parties || []).filter(p => p.type === 'external').map(p => p.name).join(', ') || db.getUserById(d.assignedToClient)?.name || '-'}
                                </td>
                                <td class="px-4 py-3 text-sm">
                                    ${(d.parties || []).filter(p => p.type === 'internal').map(p => p.name).join(', ') || db.getUserById(d.assignedToUnit)?.name || '-'}
                                </td>
                                <td class="px-4 py-3 text-sm">${new Date(d.createdAt).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'})}</td>
                                <td class="px-4 py-3 text-sm">${d.endDate ? new Date(d.endDate).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'}) : '-'}</td>
                                <td class="px-4 py-3">
                                    <span class="px-2.5 py-1 rounded-full text-xs font-medium 
                                        ${d.status === 'signed' ? 'bg-green-100 text-green-700' : 
                                          d.status === 'draft' ? 'bg-slate-100 text-slate-600' : 
                                          'bg-yellow-100 text-yellow-700'}">
                                        ${d.status === 'signed' ? 'AKTIF' : d.status.replace('_', ' ').toUpperCase()}
                                    </span>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
                
              // Render Charts
              Handlers.renderReportCharts(mouCount, moaCount, iaCount, draftCount, reviewCount, signedCount);
          }
          
          // Store filtered docs for export
          window.reportData = docs;
        },
        
        renderReportCharts: (mou, moa, ia, draft, review, signed) => {
          // Destroy existing charts
          if (window.reportPieChartInstance) window.reportPieChartInstance.destroy();
          if (window.reportBarChartInstance) window.reportBarChartInstance.destroy();
          
          // Pie Chart
          const pieCtx = document.getElementById('reportPieChart');
          if (pieCtx) {
            window.reportPieChartInstance = new Chart(pieCtx, {
              type: 'doughnut',
              data: {
                labels: ['MoU', 'MoA', 'IA'],
                datasets: [{
                  data: [mou, moa, ia],
                  backgroundColor: ['#3b82f6', '#8b5cf6', '#14b8a6'],
                  borderWidth: 0,
                  hoverOffset: 8
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '60%',
                plugins: {
                  legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
                }
              }
            });
          }
          
          // Bar Chart
          const barCtx = document.getElementById('reportBarChart');
          if (barCtx) {
            window.reportBarChartInstance = new Chart(barCtx, {
              type: 'bar',
              data: {
                labels: ['Draft', 'Review', 'Aktif/Signed'],
                datasets: [{
                  label: 'Jumlah Dokumen',
                  data: [draft, review, signed],
                  backgroundColor: ['#64748b', '#f59e0b', '#22c55e'],
                  borderRadius: 6,
                  barThickness: 40
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { display: false }
                },
                scales: {
                  y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                  x: { grid: { display: false } }
                }
              }
            });
          }
        },

        resetReportFilter: () => {

                @media print { body { padding: 20px; } }

            </head>
            <body>

                <div class="stat-box"><div class="value">${docs.filter(d => d.type === 'MoA').length}</div><div class="label">MoA</div></div>
                <div class="stat-box"><div class="value">${docs.filter(d => d.type === 'IA').length}</div><div class="label">IA</div></div>

                      <td>${(d.parties || []).filter(p => p.type === 'internal').map(p => p.name).join(', ') || db.getUserById(d.assignedToUnit)?.name || '-'}</td>

        exportReportExcel: () => {
          const docs = window.reportData || [];
          
          // Create CSV content
          let csv = 'No,Judul Dokumen,Jenis,Mitra,Unit Pengusul,Tanggal Dibuat,Masa Berlaku,Status\n';
          docs.forEach((d, i) => {
            const mitra = (d.parties || []).filter(p => p.type === 'external').map(p => p.name).join('; ') || db.getUserById(d.assignedToClient)?.name || '-';
            const unit = (d.parties || []).filter(p => p.type === 'internal').map(p => p.name).join('; ') || db.getUserById(d.assignedToUnit)?.name || '-';
            csv += `${i+1},"${d.title}",${d.type},"${mitra}","${unit}",${new Date(d.createdAt).toLocaleDateString('id-ID')},${d.endDate ? new Date(d.endDate).toLocaleDateString('id-ID') : '-'},${d.status === 'signed' ? 'AKTIF' : d.status.replace('_', ' ').toUpperCase()}\n`;
          });
          
          // Download CSV
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `laporan_kerjasama_${new Date().toISOString().split('T')[0]}.csv`;

          alert('File laporan berhasil diexport! Format: CSV (bisa dibuka di Excel)');
        },

        // ==========================================
        // TRACKING DOCUMENT HANDLERS
        // ==========================================

        attachTracking: () => {
          const searchInput = document.getElementById('tracking-search');
          if (searchInput) {
            let debounceTimer;
            searchInput.addEventListener('input', (e) => {
              clearTimeout(debounceTimer);
              debounceTimer = setTimeout(() => {
                Handlers.searchAndTrack(e.target.value.trim());
              }, 300);
            });
          }
        },

        searchAndTrack: (keyword) => {
          const resultsContainer = document.getElementById('tracking-results');
          if (!resultsContainer) return;

          if (!keyword || keyword.length < 2) {
            resultsContainer.innerHTML = `
              <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-12 text-center">
                <div class="w-20 h-20 mx-auto bg-slate-100 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-diagram-project text-3xl text-slate-400"></i>
                </div>
                <h4 class="text-lg font-bold text-slate-700 mb-2">Mulai Pencarian</h4>
                <p class="text-slate-500 max-w-md mx-auto">
                    Ketik minimal 2 karakter untuk mencari dokumen dan melihat visualisasi hierarki.
                </p>
              </div>`;
            return;
          }

          const allDocs = db.getDocs();
          const keywordLower = keyword.toLowerCase();

          // Search in title, parties, client, unit
          const matchedDocs = allDocs.filter(doc => {
            const title = doc.title?.toLowerCase() || '';
            const partiesStr = (doc.parties || []).map(p => p.name?.toLowerCase() || '').join(' ');
            const client = db.getUserById(doc.assignedToClient)?.name?.toLowerCase() || '';
            const unit = db.getUserById(doc.assignedToUnit)?.name?.toLowerCase() || '';
            
            return title.includes(keywordLower) || 
                   partiesStr.includes(keywordLower) || 
                   client.includes(keywordLower) || 
                   unit.includes(keywordLower);
          });

          if (matchedDocs.length === 0) {
            resultsContainer.innerHTML = `
              <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-12 text-center">
                <div class="w-20 h-20 mx-auto bg-red-50 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-search text-3xl text-red-400"></i>
                </div>
                <h4 class="text-lg font-bold text-slate-700 mb-2">Tidak Ditemukan</h4>
                <p class="text-slate-500 max-w-md mx-auto">
                    Tidak ada dokumen yang cocok dengan keyword "<strong>${keyword}</strong>". Coba kata kunci lain.
                </p>
              </div>`;
            return;
          }

          // Build hierarchies for matched documents
          const hierarchies = Handlers.buildDocumentHierarchies(matchedDocs, allDocs);
          
          // Render results
          let html = `
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 mb-4">
              <div class="flex items-center justify-between">
                <span class="text-sm text-slate-600">
                  <i class="fa-solid fa-search text-slate-400 mr-2"></i>
                  Ditemukan <strong>${matchedDocs.length}</strong> dokumen untuk "<strong>${keyword}</strong>"
                </span>
                <span class="text-sm text-slate-500">
                  Menampilkan <strong>${hierarchies.length}</strong> hierarki terhubung
                </span>
              </div>
            </div>`;

          hierarchies.forEach((hierarchy, index) => {
            html += Handlers.renderHierarchyTree(hierarchy, matchedDocs.map(d => d.id), index);
          });

          resultsContainer.innerHTML = html;
        },

        buildDocumentHierarchies: (matchedDocs, allDocs) => {
          const processedMouIds = new Set();
          const hierarchies = [];

          // Helper: find parent MoA for IA
          const findParentMoA = (iaDoc) => {
            return allDocs.find(d => d.id === iaDoc.parentDocId && d.type === 'MoA');
          };

          // Helper: find parent MoU for MoA
          const findParentMoU = (moaDoc) => {
            return allDocs.find(d => d.id === moaDoc.parentDocId && d.type === 'MoU');
          };

          // Helper: find child MoAs for MoU
          const findChildMoAs = (mouDoc) => {
            return allDocs.filter(d => d.parentDocId === mouDoc.id && d.type === 'MoA');
          };

          // Helper: find child IAs for MoA
          const findChildIAs = (moaDoc) => {
            return allDocs.filter(d => d.parentDocId === moaDoc.id && d.type === 'IA');
          };

          // Helper: trace to root MoU
          const traceToMoU = (doc) => {
            if (doc.type === 'MoU') return doc;
            if (doc.type === 'MoA') {
              const parentMoU = findParentMoU(doc);
              return parentMoU || null;
            }
            if (doc.type === 'IA') {
              const parentMoA = findParentMoA(doc);
              if (parentMoA) {
                const parentMoU = findParentMoU(parentMoA);
                return parentMoU || null;
              }
            }
            return null;
          };

          // Process each matched document
          matchedDocs.forEach(doc => {
            const rootMoU = traceToMoU(doc);
            
            if (rootMoU && !processedMouIds.has(rootMoU.id)) {
              processedMouIds.add(rootMoU.id);
              
              // Build full tree from MoU
              const childMoAs = findChildMoAs(rootMoU);
              const hierarchy = {
                mou: rootMoU,
                moas: childMoAs.map(moa => ({
                  doc: moa,
                  ias: findChildIAs(moa)
                }))
              };
              
              hierarchies.push(hierarchy);
            } else if (!rootMoU) {
              // Orphan document (no parent chain)
              if (doc.type === 'MoU' && !processedMouIds.has(doc.id)) {
                processedMouIds.add(doc.id);
                const childMoAs = findChildMoAs(doc);
                hierarchies.push({
                  mou: doc,
                  moas: childMoAs.map(moa => ({
                    doc: moa,
                    ias: findChildIAs(moa)
                  }))
                });
              } else if (doc.type === 'MoA') {
                // MoA without parent MoU
                hierarchies.push({
                  mou: null,
                  moas: [{
                    doc: doc,
                    ias: findChildIAs(doc)
                  }]
                });
              } else if (doc.type === 'IA') {
                // IA without parent chain
                hierarchies.push({
                  mou: null,
                  moas: [{
                    doc: null,
                    ias: [doc]
                  }]
                });
              }
            }
          });

          return hierarchies;
        },

        renderHierarchyTree: (hierarchy, matchedIds, index) => {
          const isMatched = (docId) => matchedIds.includes(docId);
          
          const renderDocCard = (doc, type, level = 0) => {
            if (!doc) return '';
            
            const typeColors = {
              MoU: 'bg-blue-500 border-blue-500',
              MoA: 'bg-purple-500 border-purple-500',
              IA: 'bg-teal-500 border-teal-500'
            };
            
            const typeBgColors = {
              MoU: 'bg-blue-50 border-blue-200',
              MoA: 'bg-purple-50 border-purple-200',
              IA: 'bg-teal-50 border-teal-200'
            };
            
            const statusBadge = {
              draft: 'bg-slate-100 text-slate-600',
              review_client: 'bg-yellow-100 text-yellow-700',
              review_unit: 'bg-blue-100 text-blue-700',
              signed: 'bg-green-100 text-green-700'
            };
            
            const matched = isMatched(doc.id);
            const matchedRing = matched ? 'ring-4 ring-yellow-400 ring-offset-2' : '';
            
            const mitra = (doc.parties || []).filter(p => p.type === 'external').map(p => p.name).join(', ') || db.getUserById(doc.assignedToClient)?.name || '-';
            
            return `
              <div class="relative ${matchedRing} rounded-xl ${typeBgColors[type]} border-2 p-4 transition hover:shadow-md cursor-pointer" onclick="App.navigate('editor', {id: '${doc.id}'})">
                ${matched ? '<div class="absolute -top-2 -right-2 w-6 h-6 bg-yellow-400 rounded-full flex items-center justify-center"><i class="fa-solid fa-star text-white text-xs"></i></div>' : ''}
                <div class="flex items-start gap-3">
                  <div class="w-10 h-10 ${typeColors[type]} rounded-lg flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
                    ${type}
                  </div>
                  <div class="flex-1 min-w-0">
                    <h5 class="font-semibold text-slate-800 text-sm truncate" title="${doc.title}">${doc.title}</h5>
                    <p class="text-xs text-slate-500 mt-0.5 truncate">${mitra}</p>
                    <div class="flex items-center gap-2 mt-2">
                      <span class="px-2 py-0.5 ${statusBadge[doc.status] || 'bg-slate-100 text-slate-600'} rounded-full text-xs font-medium">
                        ${doc.status === 'signed' ? 'AKTIF' : doc.status.replace('_', ' ').toUpperCase()}
                      </span>
                      <span class="text-xs text-slate-400">${new Date(doc.createdAt).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'})}</span>
                    </div>
                  </div>
                </div>
              </div>`;
          };

          let html = `
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 mb-4">
              <div class="flex items-center gap-2 mb-6">
                <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 font-bold text-sm">
                  ${index + 1}
                </div>
                <h4 class="font-bold text-slate-700">Hierarki Dokumen</h4>
              </div>
              
              <div class="space-y-4">`;

          // Render MoU (root)
          if (hierarchy.mou) {
            html += `
              <div class="pl-0">
                ${renderDocCard(hierarchy.mou, 'MoU')}
              </div>`;
          }

          // Render MoAs
          if (hierarchy.moas && hierarchy.moas.length > 0) {
            hierarchy.moas.forEach((moaData, moaIndex) => {
              const isLastMoa = moaIndex === hierarchy.moas.length - 1;
              
              if (moaData.doc) {
                html += `
                  <div class="pl-8 relative">
                    <div class="absolute left-4 top-0 -translate-y-4 w-px h-8 bg-slate-300"></div>
                    <div class="absolute left-4 top-4 w-4 h-px bg-slate-300"></div>
                    ${renderDocCard(moaData.doc, 'MoA')}
                  </div>`;
              }

              // Render IAs
              if (moaData.ias && moaData.ias.length > 0) {
                moaData.ias.forEach((ia, iaIndex) => {
                  const isLastIa = iaIndex === moaData.ias.length - 1;
                  html += `
                    <div class="pl-16 relative">
                      <div class="absolute left-12 top-0 -translate-y-4 w-px h-8 bg-slate-200"></div>
                      <div class="absolute left-12 top-4 w-4 h-px bg-slate-200"></div>
                      ${renderDocCard(ia, 'IA')}
                    </div>`;
                });
              }
            });
          }

          // If no MoAs found but MoU exists
          if (hierarchy.mou && (!hierarchy.moas || hierarchy.moas.length === 0)) {
            html += `
              <div class="pl-8 py-3 text-slate-400 text-sm italic border-l-2 border-dashed border-slate-200 ml-4">
                <i class="fa-solid fa-info-circle mr-2"></i>
                Belum ada MoA turunan dari MoU ini
              </div>`;
          }

          html += `
              </div>
            </div>`;

          return html;
        },
      };

      /**
       * ==========================================
       * MAIN APP ENTRY
       * ==========================================
       */

      const App = {
        state: {
          currentPage: 1
        },
        init() {
          Auth.init();
          if (Auth.check()) {
            this.navigate("dashboard");
          } else {
            this.navigate("login");
          }
        },
        navigate: (route, params) => Router.navigate(route, params),
      };

      // Start App
      window.addEventListener("DOMContentLoaded", () => {
        App.init();
      });
    </script>
  </body>
